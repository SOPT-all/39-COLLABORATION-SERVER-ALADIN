
# ========================================
# 🏷️ SOPT Collaboration Sever Aladin - PR Auto Labeler
# ========================================

# 📌 자동 라벨링 대상
enable:
  issues: true
  prs: true

# 💬 PR 자동 코멘트
comments:
  prs: |
    ## 🤖 PR 자동 라벨링 완료!

    안녕하세요! ALADIN SERVER 팀입니다. 👋

    PR 제목 및 내용을 분석하여
    작업 유형에 맞는 라벨을 자동으로 적용했습니다.

    ### 📋 PR 체크리스트
    - [ ] PR 제목이 컨벤션에 맞게 작성되었나요?
    - [ ] 변경 사항을 충분히 설명했나요?
    - [ ] 불필요한 코드나 디버깅 로그는 제거했나요?
    - [ ] 로컬 테스트를 완료했나요?
    - [ ] 리뷰어가 확인해야 할 사항을 작성했나요?

    ### 💡 PR 제목 예시
    `feat(book): 도서 상세 조회 API 구현`

    잘못된 라벨이 있다면 직접 수정해 주세요!

    리뷰도 꼼꼼히 부탁드립니다. 🙌

    ---
    🏷️ *SOPT ALADIN SERVER · Auto Labeler*

# ========================================
# 🎨 PR Label Rules
# ========================================

labels:

  # ✨ 새로운 기능
  '✨ feat':
    include:
      - '(?i)^feat(\([^)]+\))?!?:'

  # 🐛 버그 수정
  '🐛 fix':
    include:
      - '(?i)^fix(\([^)]+\))?!?:'

  # 📦 빌드 및 의존성
  '📦 build':
    include:
      - '(?i)^build(\([^)]+\))?!?:'

  # 🧹 기타 유지보수
  '🧹 chore':
    include:
      - '(?i)^chore(\([^)]+\))?!?:'

  # ⚙️ CI/CD
  '⚙️ ci':
    include:
      - '(?i)^ci(\([^)]+\))?!?:'

  # 📝 문서
  '📝 docs':
    include:
      - '(?i)^docs(\([^)]+\))?!?:'

  # 🎨 코드 스타일
  '🎨 style':
    include:
      - '(?i)^style(\([^)]+\))?!?:'

  # ♻️ 리팩터링
  '♻️ refactor':
    include:
      - '(?i)^refactor(\([^)]+\))?!?:'

  # 🧪 테스트
  '🧪 test':
    include:
      - '(?i)^test(\([^)]+\))?!?:'

  # 🚀 배포 및 릴리스
  '🚀 release':
    include:
      - '(?i)^release(\([^)]+\))?!?:'
