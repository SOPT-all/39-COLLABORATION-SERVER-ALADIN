name: Aladin CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aladin-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build and Test
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew clean test bootJar

      - name: Prepare JAR
        run: |
          JAR=$(find build/libs -maxdepth 1 \
            -name '*.jar' \
            ! -name '*-plain.jar' \
            -type f | head -n 1)

          test -n "$JAR"
          cp "$JAR" aladin.jar
          sha256sum aladin.jar > aladin.jar.sha256

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/aladin-deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/aladin-deploy ~/.ssh/known_hosts

          scp -o BatchMode=yes -i ~/.ssh/aladin-deploy \
            aladin.jar \
            "$EC2_USER@$EC2_HOST:aladin.jar.next"

          ssh -o BatchMode=yes -i ~/.ssh/aladin-deploy \
            "$EC2_USER@$EC2_HOST" 'bash -s' <<'EOF'
          set -eu

          TARGET="$HOME/39-COLLABORATION-SERVER-ALADIN/build/libs/aladin-0.0.1-SNAPSHOT.jar"
          NEXT="$HOME/aladin.jar.next"
          BACKUP="${TARGET}.previous"

          test -f "$NEXT"
          cp -f "$TARGET" "$BACKUP"
          mv -f "$NEXT" "$TARGET"

          if sudo systemctl restart aladin; then
            for attempt in $(seq 1 12); do
              if curl -fsS http://127.0.0.1:8080/swagger-ui/index.html >/dev/null; then
                exit 0
              fi
              sleep 5
            done
          fi

          mv -f "$BACKUP" "$TARGET"
          sudo systemctl restart aladin
          exit 1
          EOF

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            "deploy-${GITHUB_SHA}" \
            aladin.jar aladin.jar.sha256 \
            --target "$GITHUB_SHA" \
            --title "Aladin ${GITHUB_SHA}" \
            --notes "Automated deployment" \
            --latest
